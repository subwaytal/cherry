<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Cherry — A little moment on vinyl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  font-family: "Jost", sans-serif;
  color: #37302f;
  background: #fff;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 280px; }
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid #a84750;
  outline-offset: 5px;
}
button { cursor: pointer; }
.page {
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 36px 20px;
}
.player {
  --playing: paused;
  --arm-angle: 5deg;
  --arm-shadow: 5px;
  --progress: 0%;
  --volume: 65%;
  --knob-angle: 40.5deg;
  width: min(100%, 640px);
  text-align: center;
}
.heading { margin-bottom: 27px; }
.eyebrow {
  margin: 0 0 2px;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: .31em;
  color: #aa9691;
}
h1 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(48px, 9vw, 68px);
  font-weight: 500;
  font-style: italic;
  letter-spacing: -.045em;
  line-height: 1.06;
  margin: 0;
}
.subtitle {
  margin: 12px 0 0;
  color: #a79792;
  font-size: 12px;
  font-weight: 300;
  letter-spacing: .08em;
}
.stage { position: relative; isolation: isolate; }
.stage::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 76% 7% -7%;
  border-radius: 50%;
  background: #75645b;
  opacity: .17;
  filter: blur(20px);
}
.stage::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 95% 10% -12%;
  border-radius: 50%;
  background: linear-gradient(#eee8e3, #fff);
  filter: blur(15px);
  opacity: .4;
}
.plinth {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 9px 9px 12px 12px;
  background:
    linear-gradient(124deg, #fff8 0%, transparent 38%, #eaded722 70%, #fff9),
    linear-gradient(174deg, #fdfcfb 0%, #fff 36%, #f8f6f3 100%);
  border: 1px solid #ebe7e2;
  box-shadow:
    inset 0 1px 0 1px #fff,
    inset 1px 0 2px #fff,
    inset -1px 0 3px #e5dfd7,
    0 7px 0 -1px #e6e2dc,
    0 9px 0 -2px #d6d0c8,
    0 12px 9px -7px #86786b55,
    0 23px 35px -22px #75665a55;
}
.grain {
  position: absolute;
  width: 100%;
  height: 100%;
  inset: 0;
  border-radius: inherit;
  opacity: .035;
  pointer-events: none;
  mix-blend-mode: multiply;
}
.hinge {
  position: absolute;
  top: -1px;
  width: 7%;
  height: 3.5%;
  border-radius: 2px 2px 4px 4px;
  background: linear-gradient(#0f1010, #363737 37%, #0c0d0d 46%, #222323);
  box-shadow: 0 3px 4px #0003, inset 1px 0 #7776;
}
.hinge.left { left: 9%; }
.hinge.right { right: 9%; }
.hinge::after {
  content: "";
  position: absolute;
  inset: 3px 24% auto;
  height: 1px;
  background: #a6a6a64d;
}
.record {
  position: absolute;
  width: 65.625%;
  aspect-ratio: 1;
  left: 5%;
  top: 6.25%;
  border-radius: 50%;
  background: #141516;
  border: 1px solid #74716e;
  box-shadow:
    0 0 0 3px #bcb8b2,
    0 0 0 4px #eeeae5,
    1px 5px 0 5px #b4afa8,
    2px 9px 10px 2px #312c2a4d,
    inset 0 0 0 2px #070808;
}
.record::before {
  content: "";
  position: absolute;
  inset: 1%;
  border-radius: inherit;
  background:
    repeating-radial-gradient(circle, transparent 0 1px, #a8a5a51c 1.3px 1.7px, #0008 2px 2.6px),
    radial-gradient(circle, #0c0d0e 0 31%, #222325 32%, #090a0b 70%);
}
.rotor {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  animation: revolution 1.8s linear infinite;
  animation-play-state: var(--playing);
  background: conic-gradient(from 20deg, transparent, #b2a9a30b 12%, transparent 27%, #0002 49%, transparent 64%, #ffffff08 84%, transparent);
}
.label {
  position: absolute;
  width: 29%;
  height: 29%;
  top: 35.5%;
  left: 35.5%;
  border-radius: 50%;
  overflow: hidden;
  background: #fffdfb;
  box-shadow: 0 0 0 1px #d6c8bc, 0 1px 5px #0008;
}
.label img { width: 100%; height: 100%; object-fit: cover; display: block; }
.label::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 8px #a887641c;
  background: linear-gradient(130deg, #fff2, transparent 60%, #77523b12);
}
.reflection {
  position: absolute;
  inset: 1%;
  border-radius: inherit;
  pointer-events: none;
  background: conic-gradient(
    from -39deg,
    #fff0 0deg, #fff2 16deg, #eee6 24deg, #fff1 34deg,
    #0000 54deg, #0000 155deg, #d7d8dd18 171deg,
    #fff3 190deg, #fff1 203deg, #0000 227deg, #0000 360deg
  );
  -webkit-mask: radial-gradient(circle, transparent 0 22%, #000 23%);
  mask: radial-gradient(circle, transparent 0 22%, #000 23%);
  box-shadow: inset 0 0 0 1px #e4e1dc33;
}
.spindle {
  position: absolute;
  width: 3.1%;
  height: 3.1%;
  left: 48.45%;
  top: 48.45%;
  border-radius: 50%;
  background: radial-gradient(circle at 31% 22%, #fff 0 12%, #ebdfcf 26%, #a59b8f 45%, #fff 57%, #5b5754 85%);
  box-shadow: 1px 2px 3px #0008;
}
.arm-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.tonearm {
  transform-origin: 548px 100px;
  transform: rotate(var(--arm-angle));
  transition: transform 1.1s cubic-bezier(.25,.65,.3,1), filter .8s;
  filter: drop-shadow(var(--arm-shadow) 7px 3px #0004);
}
.player[data-playing="true"] { --playing: running; --arm-shadow: 2px; }
.brand {
  position: absolute;
  right: 7.5%;
  bottom: 6%;
  color: #9f8980;
  font-size: clamp(9px, 1.8vw, 12px);
  letter-spacing: .2em;
  font-weight: 300;
}
.brand small { display: block; margin-top: 3px; font-size: 6px; letter-spacing: .25em; color: #b9ada6; }
.speed {
  position: absolute;
  left: 6%;
  bottom: 5%;
  color: #b0a39b;
  font-size: clamp(7px, 1.4vw, 9px);
  letter-spacing: .12em;
}
.knob-area { position: absolute; right: 8%; top: 71%; width: 9%; aspect-ratio: 1; }
.knob {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  touch-action: none;
  cursor: ns-resize;
  background:
    radial-gradient(circle at 38% 29%, #fff8, transparent 48%),
    conic-gradient(#d4b4a1, #f8eee6 17%, #ab8874 36%, #f2dccc 55%, #c19d88 74%, #f9e9dd 90%, #d4b4a1);
  border: 1px solid #bca795;
  box-shadow: 1px 4px 5px #6f534333, 0 0 0 3px #ece7e0, inset 0 0 0 3px #fff5;
}
.knob::before {
  content: "";
  position: absolute;
  inset: 10%;
  border-radius: inherit;
  background: linear-gradient(135deg, #fffdf8, #e7d6c7);
  box-shadow: 0 1px 2px #876f5855;
}
.knob-indicator {
  position: absolute;
  inset: 13%;
  transform: rotate(var(--knob-angle));
}
.knob-indicator::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 24%;
  top: 0;
  left: calc(50% - 1px);
  border-radius: 1px;
  background: #96665b;
}
.knob-caption { display: block; margin-top: 9px; font-size: 7px; letter-spacing: .18em; color: #ab9790; }
.controls { width: min(100%, 440px); margin: 38px auto 0; }
.track-info { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; text-align: left; }
.track-title { font-size: 15px; font-weight: 400; letter-spacing: .035em; }
.track-note { font-size: 9px; color: #b19c94; letter-spacing: .19em; }
input[type="range"] {
  appearance: none;
  -webkit-appearance: none;
  display: block;
  width: 100%;
  height: 22px;
  margin: 0;
  cursor: pointer;
  background: transparent;
  accent-color: #a95961;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 10px;
  background: linear-gradient(to right, #ad6b70 var(--fill), #eee6e3 var(--fill));
}
input[type="range"]::-moz-range-track {
  height: 3px;
  border-radius: 10px;
  background: linear-gradient(to right, #ad6b70 var(--fill), #eee6e3 var(--fill));
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-top: -3.5px;
  background: #aa626a;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px #aa626a22;
}
input[type="range"]::-moz-range-thumb {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #aa626a;
  border: 2px solid white;
}
#seek { --fill: var(--progress); }
#volume { --fill: var(--volume); }
.times { display: flex; justify-content: space-between; color: #b09e97; font-size: 10px; font-variant-numeric: tabular-nums; }
.transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; margin-top: 12px; }
.play {
  width: 53px;
  height: 53px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #98535b;
  border: 1px solid #ecdcda;
  background: linear-gradient(145deg, #fff, #faf1ef);
  box-shadow: 0 4px 10px #b58d7912, inset 0 1px #fff;
  transition: box-shadow .2s, transform .2s;
}
.play:hover { box-shadow: 0 5px 14px #b58d792a; }
.play:active { transform: scale(.96); }
.play svg { width: 19px; height: 19px; fill: currentColor; }
.pause-icon { display: none; }
[data-playing="true"] .pause-icon { display: block; }
[data-playing="true"] .play-icon { display: none; }
.edition { color: #baa8a0; font-size: 8px; letter-spacing: .14em; text-align: left; }
.volume-control { display: flex; align-items: center; gap: 7px; }
.mute {
  flex: 0 0 32px;
  width: 32px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 0;
  padding: 6px;
  color: #a18b82;
  background: transparent;
}
.mute svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.mute .muted-mark { display: none; }
.mute[aria-pressed="true"] .sound-waves { display: none; }
.mute[aria-pressed="true"] .muted-mark { display: block; }
.volume-number { min-width: 28px; font-size: 9px; color: #ad9990; text-align: right; font-variant-numeric: tabular-nums; }
.status { min-height: 20px; margin: 15px 0 0; font-size: 11px; color: #a3817b; font-weight: 300; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@keyframes revolution { to { transform: rotate(360deg); } }
@media (max-width: 420px) {
  .page { padding: 30px 20px; }
  .heading { margin-bottom: 25px; }
  .controls { margin-top: 32px; }
  .transport { gap: 12px; }
  .volume-control { gap: 3px; }
  .edition { font-size: 7px; letter-spacing: .1em; }
  .knob-caption { margin-top: 6px; font-size: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
  .rotor { animation: none; }
}
</style>
</head>
<body>
<main class="page">
  <section class="player" id="player" data-playing="false" aria-label="Cherry 턴테이블 음악 플레이어">
    <header class="heading">
      <p class="eyebrow">A LITTLE MOMENT ON VINYL</p>
      <h1>Cherry</h1>
      <p class="subtitle">Let the world wait a little.</p>
    </header>

    <div class="stage">
      <div class="plinth">
        <svg class="grain" aria-hidden="true">
          <filter id="grain-filter">
            <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
          </filter>
          <rect width="100%" height="100%" filter="url(#grain-filter)" opacity=".7"/>
        </svg>
        <span class="hinge left" aria-hidden="true"></span>
        <span class="hinge right" aria-hidden="true"></span>

        <div class="record" aria-hidden="true">
          <div class="rotor">
            <div class="label"><img src="cherry.png" alt="" draggable="false"></div>
          </div>
          <div class="reflection"></div>
          <span class="spindle"></span>
        </div>

        <svg class="arm-svg" viewBox="0 0 640 480" aria-hidden="true">
          <defs>
            <linearGradient id="arm-metal" x1="0" x2="1">
              <stop stop-color="#070909"/>
              <stop offset=".28" stop-color="#242728"/>
              <stop offset=".43" stop-color="#535758"/>
              <stop offset=".58" stop-color="#272a2b"/>
              <stop offset="1" stop-color="#080a0a"/>
            </linearGradient>
            <linearGradient id="silver" x1="0" x2="1">
              <stop stop-color="#797773"/>
              <stop offset=".22" stop-color="#e4e0da"/>
              <stop offset=".4" stop-color="#fff"/>
              <stop offset=".62" stop-color="#b6b4b0"/>
              <stop offset=".8" stop-color="#e5e2dd"/>
              <stop offset="1" stop-color="#757773"/>
            </linearGradient>
            <linearGradient id="counterweight" x1="0" x2="1">
              <stop stop-color="#101212"/>
              <stop offset=".2" stop-color="#292b2c"/>
              <stop offset=".42" stop-color="#4a4d4e"/>
              <stop offset=".6" stop-color="#242627"/>
              <stop offset="1" stop-color="#090b0b"/>
            </linearGradient>
            <radialGradient id="pivot">
              <stop stop-color="#70706b"/>
              <stop offset=".45" stop-color="#252727"/>
              <stop offset=".8" stop-color="#101212"/>
              <stop offset="1" stop-color="#666763"/>
            </radialGradient>
          </defs>
          <ellipse cx="550" cy="106" rx="35" ry="30" fill="#3b332c" opacity=".12"/>
          <circle cx="548" cy="100" r="29" fill="url(#silver)"/>
          <circle cx="548" cy="100" r="25" fill="url(#pivot)"/>
          <rect x="556" y="212" width="23" height="9" rx="3" fill="url(#silver)"/>
          <rect x="565" y="205" width="6" height="24" rx="2" fill="#353736"/>
          <g class="tonearm">
            <rect x="542" y="49" width="12" height="67" rx="5" fill="url(#arm-metal)"/>
            <rect x="531" y="42" width="34" height="39" rx="7" fill="url(#counterweight)" stroke="#111"/>
            <path d="M535 48H560M535 73H560" stroke="#767979" stroke-opacity=".35"/>
            <rect x="542" y="96" width="12" height="293" rx="6" fill="url(#arm-metal)"/>
            <path d="M546 133V372" stroke="#b4b7b8" stroke-opacity=".22" stroke-width="1"/>
            <rect x="535" y="107" width="26" height="22" rx="4" fill="url(#silver)"/>
            <rect x="539" y="112" width="18" height="12" rx="2" fill="#303232"/>
            <circle cx="548" cy="100" r="10" fill="url(#counterweight)" stroke="#676864"/>
            <circle cx="548" cy="100" r="3" fill="#b0a392"/>
            <path d="M538 380H558L561 411Q548 419 535 411Z" fill="url(#arm-metal)" stroke="#080909"/>
            <path d="M542 388V404M548 388V404M554 388V404" stroke="#5a5d5e" stroke-width="2"/>
            <path d="M558 389L575 396L577 393" fill="none" stroke="#3b3d3d" stroke-width="3" stroke-linecap="round"/>
            <rect x="541" y="411" width="14" height="8" rx="2" fill="#a4766a"/>
            <path d="M548 419V423" stroke="#d0cbc5" stroke-width="2"/>
          </g>
        </svg>

        <div class="knob-area">
          <div class="knob" id="knob" role="slider" tabindex="0"
               aria-label="볼륨 노브" aria-valuemin="0" aria-valuemax="100"
               aria-valuenow="65" aria-valuetext="65%">
            <span class="knob-indicator"></span>
          </div>
          <span class="knob-caption" aria-hidden="true">VOLUME</span>
        </div>
        <span class="speed" aria-hidden="true">33⅓ RPM · STEREO</span>
        <div class="brand" aria-hidden="true">cherry<small>THE SLOW COLLECTION</small></div>
      </div>
    </div>

    <div class="controls">
      <div class="track-info">
        <span class="track-title">Cherry</span>
        <span class="track-note">SIDE A · ON REPEAT</span>
      </div>
      <label class="sr-only" for="seek">곡 재생 위치</label>
      <input id="seek" type="range" min="0" max="186" step=".1" value="0" aria-valuetext="0분 0초">
      <div class="times">
        <span id="elapsed">0:00</span>
        <span id="duration">3:06</span>
      </div>
      <div class="transport">
        <span class="edition">JUST YOU & THE MUSIC</span>
        <button class="play" id="play" type="button" aria-label="재생">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.8a1 1 0 0 1 1.5-.86l11 7.2a1 1 0 0 1 0 1.72l-11 7.2A1 1 0 0 1 8 19.2Z"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <div class="volume-control">
          <button class="mute" id="mute" type="button" aria-label="음소거" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 5L5 9H2V15H5L10 19Z"/>
              <g class="sound-waves"><path d="M14 8a6 6 0 0 1 0 8M17 5a10 10 0 0 1 0 14"/></g>
              <path class="muted-mark" d="M15 9L21 15M21 9L15 15"/>
            </svg>
          </button>
          <label class="sr-only" for="volume">음량</label>
          <input id="volume" type="range" min="0" max="100" step="1" value="65">
          <output class="volume-number" id="volume-number" for="volume">65%</output>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
    <audio id="audio" src="cherry.mp3" loop preload="auto"></audio>
  </section>
</main>
<script>
(() => {
  "use strict";

  const audio = document.getElementById("audio");
  const player = document.getElementById("player");
  const playButton = document.getElementById("play");
  const muteButton = document.getElementById("mute");
  const volume = document.getElementById("volume");
  const knob = document.getElementById("knob");
  const volumeNumber = document.getElementById("volume-number");
  const seek = document.getElementById("seek");
  const elapsed = document.getElementById("elapsed");
  const duration = document.getElementById("duration");
  const status = document.getElementById("status");
  const storageKey = "cherry-turntable-volume";

  let needsGesture = false;
  let pendingPlay = false;
  let frame = 0;
  let drag = null;
  let previousVolume = 0.65;

  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const knownDuration = () => Number.isFinite(audio.duration) && audio.duration > 0;
  const total = () => knownDuration() ? audio.duration : 186;
  const format = seconds => {
    const s = Math.max(0, Math.floor(seconds || 0));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };

  try {
    const stored = localStorage.getItem(storageKey);
    const saved = stored === null ? NaN : Number(stored);
    audio.volume = Number.isFinite(saved) ? clamp(saved, 0, 1) : 0.65;
  } catch {
    audio.volume = 0.65;
  }
  if (audio.volume > 0) previousVolume = audio.volume;

  function updateVolume() {
    const effectiveVolume = audio.muted ? 0 : audio.volume;
    const value = Math.round(effectiveVolume * 100);
    volume.value = value;
    volumeNumber.value = `${value}%`;
    player.style.setProperty("--volume", `${value}%`);
    player.style.setProperty("--knob-angle", `${-135 + value * 2.7}deg`);
    knob.setAttribute("aria-valuenow", value);
    knob.setAttribute("aria-valuetext", `${value}%`);
    volume.setAttribute("aria-valuetext", `${value}%`);
    const silent = audio.muted || audio.volume === 0;
    muteButton.setAttribute("aria-pressed", String(silent));
    muteButton.setAttribute("aria-label", silent ? "음소거 해제" : "음소거");
    try {
      localStorage.setItem(storageKey, String(audio.volume));
    } catch {}
  }

  function setVolume(value) {
    const next = clamp(value, 0, 1);
    audio.volume = next;
    audio.muted = false;
    if (next > 0) previousVolume = next;
    updateVolume();
  }

  function updateProgress() {
    const length = total();
    const current = clamp(audio.currentTime || 0, 0, length);
    const fraction = current / length;
    seek.max = length;
    seek.value = current;
    seek.setAttribute("aria-valuetext", `${format(current)} / ${format(length)}`);
    elapsed.textContent = format(current);
    duration.textContent = format(length);
    player.style.setProperty("--progress", `${fraction * 100}%`);
    player.style.setProperty("--arm-angle", audio.paused ? "5deg" : `${32 + fraction * 18}deg`);
  }

  function tick() {
    updateProgress();
    if (!audio.paused) frame = requestAnimationFrame(tick);
  }

  function syncPlayback() {
    const playing = !audio.paused;
    player.dataset.playing = String(playing);
    playButton.setAttribute("aria-label", playing ? "일시정지" : "재생");
    cancelAnimationFrame(frame);
    updateProgress();
    if (playing) frame = requestAnimationFrame(tick);
  }

  async function start() {
    if (pendingPlay || !audio.paused) return;
    pendingPlay = true;
    try {
      await audio.play();
      needsGesture = false;
      status.textContent = "";
    } catch (error) {
      if (error.name === "NotAllowedError") {
        needsGesture = true;
        status.textContent = "화면을 한 번 탭하면 음악이 시작돼요.";
      } else if (error.name !== "AbortError") {
        needsGesture = false;
        status.textContent = "음악을 불러올 수 없어요. cherry.mp3 파일을 확인해 주세요.";
      }
    } finally {
      pendingPlay = false;
    }
  }

  function togglePlayback() {
    if (audio.paused) start();
    else audio.pause();
  }

  playButton.addEventListener("click", togglePlayback);
  volume.addEventListener("input", () => setVolume(Number(volume.value) / 100));

  muteButton.addEventListener("click", () => {
    if (audio.muted) {
      audio.muted = false;
      if (audio.volume === 0) setVolume(previousVolume);
    } else if (audio.volume === 0) {
      setVolume(previousVolume);
    } else {
      previousVolume = audio.volume;
      audio.muted = true;
    }
    updateVolume();
  });

  seek.addEventListener("input", () => {
    if (!knownDuration()) {
      updateProgress();
      return;
    }
    audio.currentTime = clamp(Number(seek.value), 0, audio.duration);
    updateProgress();
  });

  knob.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    knob.focus({ preventScroll: true });
    drag = {
      id: event.pointerId,
      y: event.clientY,
      volume: audio.muted ? 0 : audio.volume
    };
    knob.setPointerCapture(event.pointerId);
  });
  knob.addEventListener("pointermove", event => {
    if (!drag || drag.id !== event.pointerId) return;
    setVolume(drag.volume + (drag.y - event.clientY) / 150);
  });
  const finishDrag = () => { drag = null; };
  knob.addEventListener("pointerup", finishDrag);
  knob.addEventListener("pointercancel", finishDrag);
  knob.addEventListener("lostpointercapture", finishDrag);
  knob.addEventListener("wheel", event => {
    event.preventDefault();
    if (event.deltaY === 0) return;
    setVolume((audio.muted ? 0 : audio.volume) - Math.sign(event.deltaY) * 0.03);
  }, { passive: false });

  knob.addEventListener("keydown", event => {
    const changes = {
      ArrowUp: 0.05, ArrowRight: 0.05,
      ArrowDown: -0.05, ArrowLeft: -0.05,
      PageUp: 0.1, PageDown: -0.1
    };
    if (Object.prototype.hasOwnProperty.call(changes, event.key)) {
      event.preventDefault();
      event.stopPropagation();
      setVolume((audio.muted ? 0 : audio.volume) + changes[event.key]);
    } else if (event.key === "Home" || event.key === "End") {
      event.preventDefault();
      setVolume(event.key === "Home" ? 0 : 1);
    }
  });

  document.addEventListener("keydown", event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.isComposing) return;
    const target = event.target;
    if (target.isContentEditable || target.matches("input, textarea, select")) return;

    if (event.code === "Space") {
      if (target.closest("button, a")) return;
      event.preventDefault();
      if (!event.repeat) togglePlayback();
    } else if (event.key === "ArrowUp" || event.key === "ArrowDown") {
      event.preventDefault();
      setVolume((audio.muted ? 0 : audio.volume) + (event.key === "ArrowUp" ? 0.05 : -0.05));
    }
  });

  document.addEventListener("click", event => {
    if (needsGesture && !event.target.closest("#play")) start();
  }, true);

  audio.addEventListener("play", () => {
    needsGesture = false;
    status.textContent = "";
    syncPlayback();
  });
  audio.addEventListener("pause", syncPlayback);
  audio.addEventListener("volumechange", updateVolume);
  audio.addEventListener("loadedmetadata", updateProgress);
  audio.addEventListener("durationchange", updateProgress);
  audio.addEventListener("timeupdate", updateProgress);
  audio.addEventListener("seeking", updateProgress);
  audio.addEventListener("waiting", () => {
    if (!audio.paused) status.textContent = "음악을 불러오는 중이에요.";
  });
  audio.addEventListener("playing", () => { status.textContent = ""; });
  audio.addEventListener("error", () => {
    needsGesture = false;
    audio.pause();
    status.textContent = "음악을 불러올 수 없어요. cherry.mp3 파일을 확인해 주세요.";
  });

  updateVolume();
  updateProgress();
  start();
})();
</script>
</body>
</html>
